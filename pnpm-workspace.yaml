packages:
  - apps/*
  - packages/*

overrides:
  vite@8.3.0: 8.3.3
  source-map-js@1.2.1: 1.2.2
  undici@8.10.2: 8.12.2
  zod@4.6.5: 4.6.6

auditConfig:
  # ESLint-only fast-glob dependency; accepts repository-controlled patterns.
  # No patched braces release exists. Revisit when upstream removes/fixes it.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
